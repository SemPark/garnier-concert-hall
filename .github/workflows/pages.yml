name: Redirect the old GitHub Pages address
# The site now builds and deploys on Cloudflare from this repository. GitHub Pages only keeps a small page that
# sends the old address to the new one; it runs again only if the redirect itself changes.
on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
