<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&amp;family=Gowun+Batang:wght@400;700&amp;display=swap"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#a58b60"/><meta name="description" content="플리 · 플레이리스트 음악당. 함께 걷고, 자리에 앉아, 같은 음악을 같은 순간에 듣는 3D 음악당."/><meta property="og:type" content="website"/><meta property="og:site_name" content="pleee"/><meta property="og:title" content="플리 · 플레이리스트 음악당"/><meta property="og:description" content="함께 걷고, 자리에 앉아, 같은 음악을 같은 순간에 듣는 3D 음악당."/><meta property="og:url" content="https://pleee.hall-live.workers.dev/"/><meta property="og:image" content="https://pleee.hall-live.workers.dev/og-image-current.jpg"/><meta property="og:image:type" content="image/jpeg"/><meta property="og:image:width" content="1200"/><meta property="og:image:height" content="630"/><meta property="og:image:alt" content="촛불과 오케스트라 사이에서 지휘하는 플리 캐릭터"/><meta name="twitter:card" content="summary_large_image"/><meta name="twitter:image" content="https://pleee.hall-live.workers.dev/og-image-current.jpg"/><title>플리 · 플레이리스트 음악당</title><style>html,body{margin:0;background:#b49a70}#world{position:fixed;inset:0}#world canvas{display:block}
#boot-screen{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#151315;color:#f1dfbb;overflow:hidden;transition:opacity .8s ease,visibility .8s;isolation:isolate;font-family:system-ui,sans-serif}
#boot-screen .boot-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;transition:transform 1.1s ease,filter .8s}
.boot-card{text-align:center;width:min(310px,calc(100vw - 64px));padding-top:30px}.boot-emblem{width:58px;height:58px;color:#d6b578;margin-bottom:30px}.boot-kicker{font-size:10px;letter-spacing:.38em;color:#c4a777;margin:0 0 15px}.boot-title{font:400 clamp(44px,9vw,62px)/1.15 'East Sea Dokdo','Gowun Batang',Georgia,serif;letter-spacing:.13em;margin:0;white-space:nowrap}.boot-subtitle{font-size:13px;letter-spacing:.24em;color:#c7b79d;margin:17px 0 64px}.boot-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#c6b89f;margin-bottom:14px;gap:12px}.boot-number{font-size:15px;color:#f2dfb8;font-variant-numeric:tabular-nums}.boot-track{height:2px;background:#e7c99024;overflow:hidden}.boot-track span{display:block;height:100%;width:0;background:#d8b674;box-shadow:0 0 16px #dbb27380;transition:width .35s ease}.boot-note{position:absolute;bottom:max(32px,env(safe-area-inset-bottom));font-size:9px;letter-spacing:.32em;color:#92816a}
#boot-screen.is-leaving{opacity:0;visibility:hidden;pointer-events:none}#boot-screen.is-leaving .boot-art{transform:scale(1.035);filter:blur(5px)}
.boot-emblem{width:36px;height:36px;margin-bottom:18px}.boot-title{font-size:21px;letter-spacing:.18em;margin-bottom:42px}.boot-meta{justify-content:center;margin-bottom:28px}.boot-number{font:300 clamp(88px,20vw,128px)/1 system-ui,sans-serif;letter-spacing:-.07em;color:#f5e5c4}.boot-number small{font-size:.26em;letter-spacing:0;margin-left:10px;color:#c4a777}.boot-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.boot-track{max-width:240px;margin:auto}
@media(prefers-reduced-motion:reduce){#boot-screen,#boot-screen .boot-art,.boot-track span{transition:none!important}}
</style></head><body><section id="boot-screen" aria-label="음악당 로딩">
<img class="boot-art" src="/loading-background.svg" alt="" fetchpriority="high"/>
<div class="boot-card"><svg class="boot-emblem" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><circle cx="32" cy="32" r="30" opacity=".35"/><path d="M15 27 32 17l17 10H15Zm3 4h28M18 47h28M21 32v11m11-11v11m11-11v11M15 50h34"/></svg><div class="boot-meta"><span id="boot-label" class="boot-status" role="status">음악당을 준비하고 있어요</span><span class="boot-number"><span id="boot-percent">0</span><small>%</small></span></div><div class="boot-track" id="boot-progress" role="progressbar" aria-label="음악당 준비 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="boot-bar"></span></div></div>
</section><script>
(()=>{
let value=0,target=0,done=false,frame=0,lastStep=0;
const screen=document.getElementById('boot-screen'),number=document.getElementById('boot-percent'),bar=document.getElementById('boot-bar'),progress=document.getElementById('boot-progress'),label=document.getElementById('boot-label');
function tick(now){
 frame=0;if(done)return;
 // Show every integer, catching up faster when a completed stage advances the target a long way.
 const delay=Math.max(12,34-(target-value)*.6);
 if(value<target&&now-lastStep>=delay){
  value++;lastStep=now;number.textContent=String(value);bar.style.width=value+'%';progress.setAttribute('aria-valuenow',String(value));
 }
 if(value===100){done=true;setTimeout(()=>{screen.classList.add('is-leaving');setTimeout(()=>screen.remove(),850)},200);return;}
 if(value<target)frame=requestAnimationFrame(tick);
}
window.addEventListener('concert-loading',event=>{
 if(done)return;
 target=Math.max(target,Math.min(100,Math.round(event.detail.progress)));label.textContent=event.detail.label;
 if(!frame&&value<target)frame=requestAnimationFrame(tick);
});
window.addEventListener('concert-loading-failed',()=>{done=true;cancelAnimationFrame(frame);screen.remove()},{once:true});
})();
</script><noscript>음악당을 열려면 JavaScript를 켜 주세요.</noscript><div id="world"></div><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
