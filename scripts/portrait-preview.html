<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLEEE · 살아 움직이는 초상화</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#21170f;color:#efdfb6;font:16px Georgia,serif}
main{text-align:center;padding:20px}
canvas{display:block;width:min(76vw,56vh);height:auto;border:12px ridge #9c743c;box-shadow:0 8px 40px #000;cursor:pointer}
button{margin-top:18px;padding:10px 18px;background:#4b281f;color:inherit;border:1px solid #ad8750;border-radius:5px;cursor:pointer}
</style>
<main><canvas aria-label="유령이 되기 전 안내원의 초상화"></canvas><button id="greet">인사하기</button></main>
<script type="module">
import * as T from 'three';
import {PaintedUsher, PORTRAIT_SIZE} from '../src/scene/PaintedUsher.ts';
const canvas = document.querySelector('canvas');
const renderer = new T.WebGLRenderer({canvas});
renderer.setSize(PORTRAIT_SIZE.width, PORTRAIT_SIZE.height, false);
const portrait = new PaintedUsher();
const scene = new T.Scene();
const camera = new T.OrthographicCamera(-1, 1, 1, -1, .1, 5);
camera.position.z = 1;
scene.add(new T.Mesh(new T.PlaneGeometry(2, 2), new T.MeshBasicMaterial({map: portrait.texture, toneMapped:false})));
let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0;
let nodAt = -Infinity, blinkAt = performance.now() + 3800;
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
function greet() { nodAt = performance.now(); }
canvas.onclick = greet;
document.querySelector('#greet').onclick = greet;
canvas.onpointermove = event => {
  const rect = canvas.getBoundingClientRect();
  targetYaw = .56 * ((event.clientX - rect.left) / rect.width - .5);
  targetPitch = .23 * ((event.clientY - rect.top) / rect.height - .42);
};
canvas.onpointerleave = () => { targetYaw = targetPitch = 0; };
function pulse(progress) {
  return progress > 0 && progress < 1 ? Math.sin(Math.PI * progress) ** 2 : 0;
}
function draw() {
  const now = performance.now();
  if (document.hidden || !portrait.ready) return;
  if (now > blinkAt + 200) blinkAt = now + 4500 + Math.random() * 1800;
  yaw += .24 * (targetYaw - yaw);
  pitch += .24 * (targetPitch - pitch);
  const moving = !reduced.matches;
  portrait.pose(moving ? yaw : 0, moving ? pitch : 0, moving ? pulse((now - nodAt) / 950) : 0, moving ? pulse((now - blinkAt) / 200) : 0);
  portrait.render(renderer);
  renderer.render(scene, camera);
}
draw();
const interval = setInterval(draw, 1000 / 20);
addEventListener('pagehide', () => {
  clearInterval(interval);
  portrait.dispose();
  renderer.dispose();
}, {once:true});
</script>
</html>
