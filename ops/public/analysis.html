<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>분야별 분석 · 공연장 방문 리포트</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/analysis.js"></script>
</head>
<body>
  <a class="skip-link" href="#areas">본문 바로가기</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/"><strong>PLEEE</strong></a>
      <nav aria-label="리포트 메뉴">
        <a href="/">방문 리포트</a>
        <a href="#areas">분야별 분석</a>
        <a href="#venue">공간 이용 지도</a>
        <a href="#history">일별 보관 기록</a>
      </nav>
    </aside>
    <main>
      <header class="hero"><div><h1>분야별 분석</h1><p>기존 방문 리포트의 조회 결과와 이 컴퓨터에 보관한 일별 집계를 표시합니다.</p></div></header>
      <div class="controls">
        <label>마지막 날짜 <input type="date" id="end"></label>
        <label>조회 기간 <select id="days"><option value="1">1일</option><option value="7" selected>7일</option><option value="14">14일</option><option value="30">30일</option></select></label>
        <button type="button" class="refresh" id="reload">로컬 기록 읽기</button>
      </div>
      <p class="panel-meta" id="status" role="status"></p>
      <section class="section" aria-label="분야별 분석"><div id="areas" class="detail-grid"></div></section>
      <section class="section panel" id="venue"><h2>공간 이용 지도</h2><div id="map"></div><div id="action-report"></div></section>
      <section class="section panel" id="history"><h2>일별 보관 기록</h2><p class="panel-meta">공연장 속성에서 내보낸 날짜별 CSV를 선택하세요. 같은 날짜의 지표를 다시 가져오면 해당 값이 갱신됩니다.</p>
        <div class="controls">
          <label>출처 <select id="source"><option value="gsc">Search Console</option><option value="ga4">GA4</option></select></label>
          <label>일별 CSV <input type="file" id="csv" accept=".csv,text/csv"></label>
          <button type="button" class="refresh" id="import">로컬에 저장</button>
        </div>
        <p class="panel-meta" id="import-status" role="status"></p><div id="daily"></div></section>
    </main>
  </div>
</body>
</html>
